name: Android Build Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew
        continue-on-error: true # Safe fallback if wrapper isn't committed

      - name: Run JVM Unit and Robot Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release Bundle (AAB)
        run: gradle bundleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcverse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcverse-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
