scripts:

  - name: Create debug keystore (FIX)
    script: |
      mkdir -p ~/.android
      keytool -genkey -v \
        -keystore ~/.android/debug.keystore \
        -storepass android \
        -alias androiddebugkey \
        -keypass android \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000 \
        -dname "CN=Android,O=Android,C=US"

  - name: Link debug keystore
    script: |
      mkdir -p /Users/builder/clone
      cp ~/.android/debug.keystore /Users/builder/clone/debug.keystore
