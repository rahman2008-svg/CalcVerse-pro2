workflows:
  android-native-build:
    name: CalcVerse Pro Stable Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      java: 17

    scripts:

      - name: Fix gradlew permission
        script: |
          chmod +x ./gradlew

      - name: Setup local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Clean project
        script: |
          ./gradlew clean --no-daemon

      - name: Build Debug APK (SAFE MODE)
        script: |
          ./gradlew assembleDebug --no-daemon -x test -x validateSigningDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
