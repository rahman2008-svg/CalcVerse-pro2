- name: Create debug keystore (SAFE FIX)
  script: |
    mkdir -p ~/.android

    if [ ! -f ~/.android/debug.keystore ]; then
      echo "Creating new debug keystore..."
      keytool -genkey -v \
        -keystore ~/.android/debug.keystore \
        -storepass android \
        -alias androiddebugkey \
        -keypass android \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000 \
        -dname "CN=Android,O=Android,C=US"
    else
      echo "Debug keystore already exists - skipping creation"
    fi
