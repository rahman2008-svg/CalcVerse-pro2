workflows:
  android-native-build:
    name: CalcVerse Pro FIXED BUILD
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      java: 17

    scripts:

      - name: Checkout info
        script: ls -la

      - name: Fix gradlew permission
        script: chmod +x ./gradlew

      - name: Setup local.properties
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create debug keystore (FIX)
        script: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android,O=Android,C=US"

      - name: Link debug keystore
        script: |
          mkdir -p /Users/builder/clone
          cp ~/.android/debug.keystore /Users/builder/clone/debug.keystore

      - name: Clean project
        script: ./gradlew clean --no-daemon

      - name: Build Debug APK
        script: ./gradlew assembleDebug --no-daemon -x test

    artifacts:
      - app/build/outputs/apk/debug/*.apk
