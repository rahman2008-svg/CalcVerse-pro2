# Codemagic configuration for native Android
workflows:
  android-native-build:
    name: CalcVerse Pro Native Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      android_signing:
        - keystore_credentials # Reference to vault
      groups:
        - default
      vars:
        PACKAGE_NAME: "com.aistudio.calcversepro.whpdmq"
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Set up local configurations
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build unit tests
        script: |
          gradle testDebugUnitTest --no-daemon
      - name: Build Debug APK
        script: |
          gradle assembleDebug --no-daemon
      - name: Build Release Bundle (AAB)
        script: |
          gradle bundleRelease --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/bundle/release/app-release.aab
    publishing:
      email:
        recipients:
          - princearabdurrahman57@gmail.com
        notify:
          success: true
          failure: true
