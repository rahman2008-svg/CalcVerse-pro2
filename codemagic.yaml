workflows:
  android-build:
    name: CalcVerse Pro Stable Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      java: 17
      groups:
        - android_signing_optional

      vars:
        PACKAGE_NAME: "com.aistudio.calcversepro.whpdmq"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Checkout fix
        script: |
          git clean -ffdx
          chmod +x gradlew

      - name: Setup local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Cache Gradle
        script: |
          ./gradlew --version

      - name: Clean project
        script: |
          ./gradlew clean --no-daemon

      - name: Build Debug APK (SAFE)
        script: |
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - dev@codemagic.io
