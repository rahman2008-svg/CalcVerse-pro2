workflows:
  android-native-build:
    name: CalcVerse Pro 2 Debug Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      java: 17
      groups:
        - default

    scripts:
      - name: Make gradlew executable
        script: chmod +x gradlew

      - name: Setup local.properties
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Clean project
        script: ./gradlew clean --no-daemon

      - name: Build Debug APK
        script: ./gradlew assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - prince.ar.abdur.rahman2008@gmail.com
        notify:
          success: true
          failure: true
